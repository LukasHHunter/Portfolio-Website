<!DOCTYPE html>
<html>
<head>
    <title>Solar Portfolio</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        /* UI container */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: sans-serif;
            z-index: 10;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid white;
            color: white;
            padding: 6px 12px;
            cursor: pointer;
        }

        /* Floating label above planet */
        #planetLabel {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: bold;
            color: white;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 9999;
        }

        .visible { opacity: 1; }

        /* Panels */
        .panel {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 400px;
            height: 400px;
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            color: #fff;
            font-family: sans-serif;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        #leftPanel {
            left: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.75);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #rightPanel { 
            right: 40px; 
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.75);
            user-select: none;
        }

        .panel.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #rightPanel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            margin-bottom: 10px;
            border-radius: 16px;
        }

        #projectImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 1;
        }

        .crossfade {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.45s ease;
        }

        #imgA { opacity: 1; }
        #imgB { opacity: 0; }

        #imageDots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 5;
            user-select: none;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            transition: transform 0.3s ease, background 0.25s ease;
        }

        .dot.active {
            background: white;
            transform: scale(1.4);
        }

        /* ---------------------- */
        /*       ARROWS FIXED     */
        /* ---------------------- */

        .arrow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* TRUE CENTER */
            width: 56px;
            height: 56px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease, transform 0.28s cubic-bezier(.2,.9,.2,1);
            z-index: 40;
            color: #ffd54f;
        }

        .arrow.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .arrow .tri {
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linejoin: round;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px currentColor);
            transition: stroke 0.2s ease, filter 0.2s ease, stroke-width 0.15s ease;
        }

        .arrow .tri2 {
            stroke-width: 2;
            opacity: 0.95;
        }

        .arrow .conn {
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            opacity: 0;
            transition: opacity 0.28s ease, stroke 0.2s ease, filter 0.2s ease;
            filter: drop-shadow(0 0 12px currentColor);
            stroke-dasharray: 8;
            stroke-dashoffset: 8;
            transition: stroke-dashoffset 0.45s ease, opacity 0.28s ease;
        }

        .arrow.visible .conn {
            opacity: 1;
            stroke-dashoffset: 0;
        }

        :root {
            --arrow-offset: 140px;
        }

        #arrowLeft {
            left: calc(50% - var(--arrow-offset));
        }

        #arrowRight {
            left: calc(50% + var(--arrow-offset));
        }

        #leftPanel, #projectTitle, #projectDesc, #planetLabel {
            user-select: none;
            cursor: default;
        }

    </style>
</head>

<body>

    <!-- UI BUTTONS -->
    <div id="ui">
        <button id="resetButton">Reset View</button>
    </div>

    <!-- FLOATING PLANET LABEL -->
    <div id="planetLabel" class="hidden"></div>

    <!-- LEFT PANEL -->
    <div id="leftPanel" class="panel">
        <h2 id="projectTitle"></h2>
        <p id="projectDesc"></p>
        <a id="projectLink" target="_blank">Github Repository</a>
    </div>

    <!-- RIGHT PANEL -->
    <div id="rightPanel" class="panel">
        <img id="projectImg1" class="crossfade" />
        <img id="projectImg2" class="crossfade" />

        <div id="imageDots"></div>
    </div>

    <!-- Left arrow -->
    <svg id="arrowLeft" class="arrow" viewBox="0 0 100 100" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
    <g transform="translate(50 50)">
        <!-- outer triangle -->
        <polygon class="tri tri1" points="10,-20 -20,0 10,20" />
        <!-- inner triangle -->
        <polygon class="tri tri2" points="5,-10 -10,0 5,10" />

        <line class="conn" x1="10" y1="-20" x2="5" y2="-10" />
        <line class="conn" x1="-20" y1="0" x2="-10" y2="0" />
        <line class="conn" x1="10" y1="20" x2="5" y2="10" />
    </g>
    </svg>

    <!-- Right arrow -->
    <svg id="arrowRight" class="arrow" viewBox="0 0 100 100" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
    <g transform="translate(50 50)">
        <!-- outer triangle -->
        <polygon class="tri tri1" points="-10,-20 20,0 -10,20" />
        <!-- inner triangle -->
        <polygon class="tri tri2" points="-5,-10 10,0 -5,10" />

        <line class="conn" x1="-10" y1="-20" x2="-5" y2="-10" />
        <line class="conn" x1="20" y1="0" x2="10" y2="0" />
        <line class="conn" x1="-10" y1="20" x2="-5" y2="10" />
    </g>
    </svg>


    <!-- MAIN SCRIPT -->
    <script type="module" src="main.js"></script>

</body>
</html>
